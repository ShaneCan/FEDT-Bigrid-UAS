# drone.targets:x,y, target height.
drone.count=2
drone.first-cf=231
drone.targets=0,-2.5,0.3;0.5,-2,0.3
# Parallel southbound lanes. D0 starts 0.5 m ahead of D1.
bigrid.service.rows=11
bigrid.service.cols=7
bigrid.service.layers=3
bigrid.service.origin.y=-2.5
# Preserve the old obstacles' physical coordinates after increasing rows.
obstacle.grids=28,105
experiment.service-url=http://localhost:5090
mission.report=experiments/results/drift/${mission.mode}.json
cdo.enabled=false
ros.update.enabled=false
# Each wind event may pause the same aircraft for the entire wind window.
experiment.events[0].id=middle-gust
experiment.events[0].type=wind
experiment.events[0].drone=231
experiment.events[0].center-fraction=0.5
experiment.events[0].ramp=3
experiment.events[0].hold=2
experiment.events[0].velocity=0.65,0.15,0
experiment.events[0].pause-forward=true
