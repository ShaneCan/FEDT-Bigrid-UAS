# Example fleet: enable cf231..cf235 in your external Crazyswarm configuration.
# Targets are world coordinates at grid cell centers.
# Set these coordinates and grid geometry for the actual flight area before running.
drone.count=5
drone.first-cf=231
drone.control.base-url=http://127.0.0.1
drone.control.start-port=5000
drone.targets=0.5,0,0.3;0.5,0.5,0.3;0.5,1,0.3;0.5,1.5,0.3;0.5,2,0.3
bigrid.service.base-url=http://localhost:7070
bigrid.service.rows=9
bigrid.service.cols=7
bigrid.service.layers=3
bigrid.service.origin.x=-1.5
bigrid.service.origin.y=-1.5
bigrid.service.origin.z=0
bigrid.service.step.x=0.5
bigrid.service.step.y=0.5
bigrid.service.layer.height=0.6
obstacle.grids=18,67
charging.station.grids=3
hardware.health.required=true
hardware.health.battery-low=3.2
hardware.health.battery-empty=3.1
hardware.health.rssi-bad=65
hardware.health.status-timeout=3
hardware.health.startup-timeout=10
fault.injection.enabled=true
fault.injection.bind=127.0.0.1
fault.injection.port=8090
# Health and control use HTTP; ROSBridge and CDO are optional observations.
ros.update.enabled=false
cdo.enabled=false
mission.report=experiments/results/hardware/${mission.mode}.json
