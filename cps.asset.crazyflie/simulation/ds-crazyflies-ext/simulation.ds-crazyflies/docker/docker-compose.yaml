name: crazyflie-webots
services:
  webots:
    image: ds-crazyflies:v3-humble
    build:
      context: ../../../..
      dockerfile: simulation/ds-crazyflies-ext/simulation.ds-crazyflies/docker/Dockerfile
    container_name: ds-crazyflies-dev
    labels:
      io.cps.crazyflie.stack: cps.asset.crazyflie.webots3
    init: true
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    runtime: ${CF_CONTAINER_RUNTIME:-runc}
    # WSLg OpenGL uses DirectX interop; NVIDIA's CUDA runtime alone is insufficient.
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: '1'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${MESA_D3D12_DEFAULT_ADAPTER_NAME:-NVIDIA}
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      CF_HEADLESS: ${CF_HEADLESS:-0}
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ../../../../controller:/workspace/controller:rw
      - ../tools:/ds/ds-crazyflies/tools:ro
      - ../tests:/ds/ds-crazyflies/tests:ro
      - ../config.json:/ds/ds-crazyflies/config.json:ro
      - ../crazyflie.wbt:/ds/crazywebotsworld/worlds/crazyflie.wbt:rw
      - ../resources/protos:/ds/crazywebotsworld/protos:ro
      - ../.runtime:/ds/ds-crazyflies/.runtime:rw
      - /tmp/.X11-unix:/host-x11:ro
      - /usr/lib/wsl:/usr/lib/wsl:ro
    working_dir: /ds/ds-crazyflies
    command: [python3, tools/runtime.py]
    healthcheck:
      test: [CMD, python3, tools/health.py]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    stop_grace_period: 20s
