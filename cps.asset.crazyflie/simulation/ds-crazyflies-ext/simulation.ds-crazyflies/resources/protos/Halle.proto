#VRML_SIM R2023b utf8
# Clear interior: X/Y [-10,10] m, Z [0,5] m; world Floor supplies the ground.
EXTERNPROTO "../assets/R2023b/projects/appearances/protos/FormedConcrete.proto"

PROTO Halle [
  field SFVec3f translation 0 0 0
]
{
  Solid {
    translation IS translation
    name "Halle"
    children [
      Transform {
        translation -10.05 0 2.5
        children [
          DEF SideWall Shape {
            appearance FormedConcrete { }
            geometry Box { size 0.1 20.2 5 }
          }
        ]
      }
      Transform { translation 10.05 0 2.5 children [ USE SideWall ] }
      Transform {
        translation 0 -10.05 2.5
        children [
          DEF EndWall Shape {
            appearance FormedConcrete { }
            geometry Box { size 20 0.1 5 }
          }
        ]
      }
      Transform { translation 0 10.05 2.5 children [ USE EndWall ] }
      Transform {
        translation 0 0 5.05
        children [
          Shape {
            appearance FormedConcrete { }
            geometry Box { size 20.2 20.2 0.1 }
          }
        ]
      }
    ]
  }
}
