#VRML_SIM R2023b utf8
# Frame envelope: 20 x 20 x 5 m, centered at the world origin.
EXTERNPROTO "../assets/R2023b/projects/appearances/protos/BrushedAluminium.proto"
EXTERNPROTO "../assets/R2023b/projects/appearances/protos/WireFence.proto"

PROTO HalleTraversen [
  field SFVec3f translation 0 0 0
]
{
  Solid {
    translation IS translation
    name "Traversen"
    children [
      Transform {
        translation -9.9 -9.9 2.4
        children [
          DEF Upright Shape {
            appearance BrushedAluminium { }
            geometry Box { size 0.2 0.2 4.8 }
          }
        ]
      }
      Transform { translation -9.9 9.9 2.4 children [ USE Upright ] }
      Transform { translation -3.3 -9.9 2.4 children [ USE Upright ] }
      Transform { translation -3.3 9.9 2.4 children [ USE Upright ] }
      Transform { translation 3.3 -9.9 2.4 children [ USE Upright ] }
      Transform { translation 3.3 9.9 2.4 children [ USE Upright ] }
      Transform { translation 9.9 -9.9 2.4 children [ USE Upright ] }
      Transform { translation 9.9 9.9 2.4 children [ USE Upright ] }
      Transform {
        translation -9.9 0 4.9
        children [
          DEF CrossRail Shape {
            appearance BrushedAluminium { }
            geometry Box { size 0.2 20 0.2 }
          }
        ]
      }
      Transform { translation -3.3 0 4.9 children [ USE CrossRail ] }
      Transform { translation 3.3 0 4.9 children [ USE CrossRail ] }
      Transform { translation 9.9 0 4.9 children [ USE CrossRail ] }
      Transform {
        translation 0 -9.9 4.9
        children [
          DEF SideRail Shape {
            appearance BrushedAluminium { }
            geometry Box { size 20 0.2 0.2 }
          }
        ]
      }
      Transform { translation 0 9.9 4.9 children [ USE SideRail ] }
      Transform {
        translation 0 -9.9 2.4
        children [
          DEF SideNet Shape {
            appearance WireFence { textureTransform TextureTransform { scale 60 15 } }
            geometry Box { size 19.8 0.01 4.8 }
          }
        ]
      }
      Transform { translation 0 9.9 2.4 children [ USE SideNet ] }
      Transform {
        translation -9.9 0 2.4
        children [
          Shape {
            appearance WireFence { textureTransform TextureTransform { scale 60 15 } }
            geometry Box { size 0.01 19.8 4.8 }
          }
        ]
      }
    ]
  }
}
