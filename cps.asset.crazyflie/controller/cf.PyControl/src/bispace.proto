syntax = "proto3";

package org.swarmwalker.messages;

import "core.proto";


message BiGrid {
  repeated Cell items = 1;  
}

message Cell {
  string id = 1;                                    
  Pose pose = 2;                                    
  Size size = 3;                                    
  repeated DataPayload attributes = 6;              
  
 
  message DataPayload {
    string type = 1;        
    string payload = 2;     
  }
}